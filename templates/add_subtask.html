<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add Subtask</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  {% include 'navbar.html' %}

  <h1>Add Subtask for "{{ task.title }}"</h1>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="title" name="title" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description"></textarea>
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status" required>
        {% for s in VALID_STATUSES %}
          <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="due_date" class="form-label">Due Date</label>
      <input type="date" class="form-control" id="due_date" name="due_date">
    </div>

    <div class="mb-3">
      <label for="priority" class="form-label">Priority</label>
      <select class="form-select" id="priority" name="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="assigned_to" class="form-label">Assigned To</label>
      <div class="d-flex">
        <select class="form-select me-2" id="assigned_to" name="assigned_to">
          {% for user in users %}
            <option value="{{ user.user_id }}">{{ user.username }}</option>
          {% endfor %}
        </select>
        <a href="{{ url_for('add_user') }}" class="btn btn-outline-primary">➕ New User</a>
      </div>
    </div>

    <button type="submit" class="btn btn-primary">Save Subtask</button>
    <a href="{{ url_for('task_detail', task_id=task.task_id) }}" class="btn btn-secondary">Cancel</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Home</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
