{% extends "base.html" %}
{% block content %}
<body class="container py-4">

 

  <h1>Add Task</h1>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="title" name="title" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description"></textarea>
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status" required>
        {% for s in VALID_STATUSES %}
          <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="area" class="form-label">Area</label>
      <select class="form-select" id="area" name="area">
        <option value="Finance">Finance</option>
        <option value="Logistics">Logistics</option>
        <option value="Sales">Sales</option>
        <option value="Factory">Factory</option>
        <option value="CROSS">CROSS</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="type" class="form-label">Type</label>
      <select class="form-select" id="type" name="type">
        <option value="Project">Project</option>
        <option value="Incident">Incident</option>
        <option value="CIP">CIP</option>
        <option value="Pain Point">Pain Point</option>
        <option value="Task">Task</option>
        <option value="Other">Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="start_date" class="form-label">Start Date</label>
      <input type="date" class="form-control" id="start_date" name="start_date">
    </div>

    <div class="mb-3">
      <label for="due_date" class="form-label">Due Date</label>
      <input type="date" class="form-control" id="due_date" name="due_date">
    </div>

    <div class="mb-3">
      <label for="priority" class="form-label">Priority</label>
      <select class="form-select" id="priority" name="priority">
        <option value="Low">Low</option>
        <option value="Medium">Medium</option>
        <option value="High">High</option>
        <option value="Critical">Critical</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="ticket_number" class="form-label">Ticket Number</label>
      <input type="text" class="form-control" id="ticket_number" name="ticket_number">
    </div>

    <div class="mb-3">
      <label for="mantis_number" class="form-label">Mantis Number</label>
      <input type="text" class="form-control" id="mantis_number" name="mantis_number">
    </div>

    <div class="mb-3">
      <label for="owner_id" class="form-label">Owner</label>
      <select class="form-select" id="owner_id" name="owner_id">
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="assigned_id" class="form-label">Assigned To</label>
      <select class="form-select" id="assigned_id" name="assigned_id">
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save Task</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
