{% extends "base.html" %}
{% block content %}
<body class="container py-4">

  <h1>Add Update</h1>

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="update_text" class="form-label">Update Text</label>
      <textarea class="form-control" id="update_text" name="update_text" required></textarea>
    </div>

    <div class="mb-3">
      <label for="update_date" class="form-label">Update Date</label>
      <input type="date" class="form-control" id="update_date" name="update_date" required>
    </div>

    <div class="mb-3">
      <label for="user_id" class="form-label">Updated By</label>
      <select class="form-select" id="user_id" name="user_id" required>
        {% for user in users %}
          <option value="{{ user.id }}">{{ user.full_name }}</option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save Update</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
