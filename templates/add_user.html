<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  {% include 'navbar.html' %}

  <h1>Add User</h1>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" required>
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" id="role" name="role" required>
        <option value="">-- Select Role --</option>
        <option value="Admin">Admin</option>
        <option value="BPL">BPL</option>
        <option value="Developer">Developer</option>
        <option value="End user">End user</option>
        <option value="Key user">Key user</option>
        <option value="Line Manager">Line Manager</option>
        <option value="Local partner">Local partner</option>
        <option value="Manager">Manager</option>
        <option value="SME">SME</option>
        <option value="Support">Support</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save User</button>
    <a href="{{ url_for('add_task') }}" class="btn btn-secondary">Back to Add Task</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Home</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
