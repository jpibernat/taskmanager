<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Confirm Delete Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" type="text/css" href="/static/styles.css">
</head>
<body class="container py-4">

  <h1>Delete Task</h1>

  <div class="alert alert-warning">
    Are you sure you want to delete the task <strong>{{ task.title }}</strong>?  
    This action cannot be undone.
  </div>

  <form method="post">
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{{ url_for('task.task_detail', task_id=task.task_id) }}" class="btn btn-secondary">Cancel</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Home</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
