<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Update</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  {% include 'navbar.html' %}

  <h1>Edit Update</h1>

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="update_text" class="form-label">Update Text</label>
      <textarea class="form-control" id="update_text" name="update_text" required>{{ update.update_text }}</textarea>
    </div>

    <div class="mb-3">
      <label for="update_date" class="form-label">Update Date</label>
      <input type="date" class="form-control" id="update_date" name="update_date" value="{{ update.update_date }}" required>
    </div>

    <div class="mb-3">
      <label for="user_id" class="form-label">Updated By</label>
      <select class="form-select" id="user_id" name="user_id">
        {% for user in users %}
          <option value="{{ user.user_id }}" {% if update.user_id == user.user_id %}selected{% endif %}>
            {{ user.username }}
          </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Save Changes</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
  </form>

</body>
</html>
