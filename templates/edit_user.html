<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit User</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">
  {% include 'navbar.html' %}

  <h1>Edit User</h1>

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="username" class="form-label">Username</label>
      <input type="text" class="form-control" id="username" name="username" value="{{ user.username }}" required>
    </div>

    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" class="form-control" id="email" name="email" value="{{ user.email }}" required>
    </div>

    <div class="mb-3">
      <label for="role" class="form-label">Role</label>
      <select class="form-select" id="role" name="role" required>
        <option value="Admin" {% if user.role == "Admin" %}selected{% endif %}>Admin</option>
        <option value="BPL" {% if user.role == "BPL" %}selected{% endif %}>BPL</option>
        <option value="Developer" {% if user.role == "Developer" %}selected{% endif %}>Developer</option>
        <option value="End user" {% if user.role == "End user" %}selected{% endif %}>End user</option>
        <option value="Key user" {% if user.role == "Key user" %}selected{% endif %}>Key user</option>
        <option value="Line Manager" {% if user.role == "Line Manager" %}selected{% endif %}>Line Manager</option>
        <option value="Local partner" {% if user.role == "Local partner" %}selected{% endif %}>Local partner</option>
        <option value="Manager" {% if user.role == "Manager" %}selected{% endif %}>Manager</option>
        <option value="SME" {% if user.role == "SME" %}selected{% endif %}>SME</option>
        <option value="Support" {% if user.role == "Support" %}selected{% endif %}>Support</option>
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Update User</button>
    <a href="{{ url_for('users_list') }}" class="btn btn-secondary">Cancel</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
