<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Edit Task</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container py-4">

  {% include 'navbar.html' %}

  <h1>Edit Task</h1>

  <!-- Flash messages -->
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      <div class="mt-3">
        {% for category, message in messages %}
          <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
  {% endwith %}

  <form method="post" class="mt-3">
    <div class="mb-3">
      <label for="title" class="form-label">Title</label>
      <input type="text" class="form-control" id="title" name="title" value="{{ task.title }}" required>
    </div>

    <div class="mb-3">
      <label for="description" class="form-label">Description</label>
      <textarea class="form-control" id="description" name="description">{{ task.description }}</textarea>
    </div>

    <div class="mb-3">
      <label for="status" class="form-label">Status</label>
      <select class="form-select" id="status" name="status" required>
        {% for s in VALID_STATUSES %}
          <option value="{{ s }}" {% if task.status == s %}selected{% endif %}>{{ s }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="area" class="form-label">Area</label>
      <select class="form-select" id="area" name="area">
        <option value="Finance" {% if task.area == "Finance" %}selected{% endif %}>Finance</option>
        <option value="Logistics" {% if task.area == "Logistics" %}selected{% endif %}>Logistics</option>
        <option value="Sales" {% if task.area == "Sales" %}selected{% endif %}>Sales</option>
        <option value="Factory" {% if task.area == "Factory" %}selected{% endif %}>Factory</option>
        <option value="CROSS" {% if task.area == "CROSS" %}selected{% endif %}>CROSS</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="type" class="form-label">Type</label>
      <select class="form-select" id="type" name="type">
        <option value="Project" {% if task.type == "Project" %}selected{% endif %}>Project</option>
        <option value="Incident" {% if task.type == "Incident" %}selected{% endif %}>Incident</option>
        <option value="CIP" {% if task.type == "CIP" %}selected{% endif %}>CIP</option>
        <option value="Pain Point" {% if task.type == "Pain Point" %}selected{% endif %}>Pain Point</option>
        <option value="Task" {% if task.type == "Task" %}selected{% endif %}>Task</option>
        <option value="Other" {% if task.type == "Other" %}selected{% endif %}>Other</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="start_date" class="form-label">Start Date</label>
      <input type="date" class="form-control" id="start_date" name="start_date" value="{{ task.start_date }}">
    </div>

    <div class="mb-3">
      <label for="due_date" class="form-label">Due Date</label>
      <input type="date" class="form-control" id="due_date" name="due_date" value="{{ task.due_date }}">
    </div>

    <div class="mb-3">
      <label for="priority" class="form-label">Priority</label>
      <select class="form-select" id="priority" name="priority">
        <option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>
        <option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>
        <option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
        <option value="Critical" {% if task.priority == "Critical" %}selected{% endif %}>Critical</option>
      </select>
    </div>

    <div class="mb-3">
      <label for="ticket_number" class="form-label">Ticket Number</label>
      <input type="text" class="form-control" id="ticket_number" name="ticket_number" value="{{ task.ticket_number }}">
    </div>

    <div class="mb-3">
      <label for="mantis_number" class="form-label">Mantis Number</label>
      <input type="text" class="form-control" id="mantis_number" name="mantis_number" value="{{ task.mantis_number }}">
    </div>

    <div class="mb-3">
      <label for="owner_id" class="form-label">Owner</label>
      <select class="form-select" id="owner_id" name="owner_id">
        {% for user in users %}
          <option value="{{ user.user_id }}" {% if task.owner_id == user.user_id %}selected{% endif %}>
            {{ user.username }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div class="mb-3">
      <label for="assigned_to" class="form-label">Assigned To</label>
      <select class="form-select" id="assigned_to" name="assigned_to">
        {% for user in users %}
          <option value="{{ user.user_id }}" {% if task.assigned_to == user.user_id %}selected{% endif %}>
            {{ user.username }}
          </option>
        {% endfor %}
      </select>
    </div>

    <button type="submit" class="btn btn-primary">Update Task</button>
    <a href="{{ url_for('task_detail', task_id=task.task_id) }}" class="btn btn-secondary">Cancel</a>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">🏠 Home</a>
  </form>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
